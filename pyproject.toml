[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "openast"
version = "0.1.0"
description = "Experimental challenge-bound signed visual evidence for agent actions"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["open-modality-trust-core==0.1.0", "qrcode[pil]>=8,<9", "zxing-cpp>=2.3,<4", "numpy>=2,<3"]

[project.optional-dependencies]
benchmark = ["opencv-python-headless>=4.10,<5"]

[project.scripts]
openast = "openast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
